name: Update Profile Stats
on:
  schedule: [{cron: "0 3 * * *"}] # Runs daily at 3 AM
  workflow_dispatch: # Allows manual refresh
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Crucial for pushing changes back

      # Generate General Stats Card
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}
          base: header, activity, community, repositories, metadata

      # Generate Top Languages Card
      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}
          base: header
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
